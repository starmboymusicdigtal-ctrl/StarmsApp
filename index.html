<!doctype html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090909" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
  <title>StarmsApp</title>
</head>
<body>
<div id="maintenance" class="overlay hidden"><div><h1>StarmsApp</h1><p>App iko kwenye matengenezo kwa sasa.</p></div></div>

<header>
  <div class="brand"><span class="star">★</span> Starms<span>App</span></div>
  <div class="header-actions"><button id="searchBtn">⌕</button><button id="menuBtn">⋮</button></div>
</header>

<section id="announcement" class="announcement hidden"></section>

<main>
  <section class="screen active" id="chats">
    <div class="creator-card">
      <img src="assets/creator-profile.png" alt="Creator">
      <div><b>StarmsApp Creator ✓</b><small>Official creator profile • visible to everyone</small></div>
    </div>
    <h3>Chats</h3>
    <div id="chatList" class="list"></div>
    <button class="fab" id="newChat">＋</button>
  </section>

  <section class="screen" id="status">
    <div class="section-title"><h3>Status</h3><small>Status huisha baada ya saa 20</small></div>
    <div class="status-row">
      <div class="status-item creator-status" id="creatorStatus"><img src="assets/creator-profile.png"><span>Creator ✓</span></div>
      <div class="status-item add-status" id="addStatus"><div class="avatar-plus">＋</div><span>My status</span></div>
    </div>
    <div id="statusFeed" class="status-feed"></div>
  </section>

  <section class="screen" id="calls">
    <div class="section-title"><h3>Calls</h3><small>Voice & video calls</small></div>
    <div class="call-actions">
      <button id="voiceCall">☎<span>Voice call</span></button>
      <button id="videoCall">▣<span>Video call</span></button>
    </div>
    <div id="callLog" class="list"></div>
  </section>

  <section class="screen" id="followers">
    <div class="profile-summary">
      <img src="assets/creator-profile.png">
      <h2 id="profileName">My StarmsApp</h2>
      <div class="counts"><div><b id="followersCount">0</b><span>Followers</span></div><div><b id="followingCount">0</b><span>Following</span></div></div>
    </div>
    <button class="primary" id="discoverBtn">Discover users</button>
    <div id="peopleList" class="list"></div>
  </section>

  <section class="screen" id="profile">
    <div class="profile-summary">
      <img id="myAvatar" src="assets/creator-profile.png">
      <h2 id="myName">StarmsApp User</h2>
      <p id="myBio">Connected on StarmsApp</p>
      <button class="primary" id="editProfile">Edit profile</button>
      <button class="secondary" id="creatorOpen">Creator Dashboard</button>
    </div>
    <div class="settings">
      <button>Privacy & Security <span>›</span></button>
      <button>Community Guidelines <span>›</span></button>
      <button>Terms & Privacy <span>›</span></button>
    </div>
  </section>
</main>

<nav>
  <button data-screen="chats" class="active">💬<span>Chats</span></button>
  <button data-screen="status">◉<span>Status</span></button>
  <button data-screen="calls">☎<span>Calls</span></button>
  <button data-screen="followers">👥<span>Followers</span></button>
  <button data-screen="profile">●<span>Profile</span></button>
</nav>

<div id="modal" class="modal hidden"><div class="modal-card"><button class="close" id="closeModal">×</button><div id="modalBody"></div></div></div>

<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
